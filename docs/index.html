        // --- CHART GENERATION ---

        let algoChartInstance = null;
        let effortChartInstance = null;

        function initCharts() {
            // 1. Effort Chart (Overview)
            const ctxEffort = document.getElementById('effortChart');
            if (ctxEffort) {
                if (effortChartInstance) effortChartInstance.destroy();
                effortChartInstance = new Chart(ctxEffort, {
                    type: 'doughnut',
                    data: {
                        labels: ['Konfiguracja', 'Architektura', 'Usługa (Service)', 'Algorytmy', 'Reakcja', 'UI', 'Testy'],
                        datasets: [{
                            data: [10, 10, 25, 20, 10, 15, 10],
                            backgroundColor: ['#E5E7EB', '#D1D5DB', '#3B82F6', '#2563EB', '#1D4ED8', '#93C5FD', '#60A5FA'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            }

            // 2. Algorithm Chart (Phase 4) - only if element exists
            const ctxAlgo = document.getElementById('algoChart');
            if (ctxAlgo) {
                if (algoChartInstance) algoChartInstance.destroy();
                
                // Initial Data: Steady State (~9.8m/s2)
                const labels = Array.from({length: 50}, (_, i) => i);
                const data = Array.from({length: 50}, () => 9.8 + (Math.random() - 0.5));

                algoChartInstance = new Chart(ctxAlgo, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Wektor G (m/s²)',
                            data: data,
                            borderColor: '#3B82F6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                            pointRadius: 0
                        }, {
                            label: 'Próg Upadku (góra)',
                            data: Array(50).fill(25),
                            borderColor: '#EF4444',
                            borderDash: [5, 5],
                            borderWidth: 1,
                            pointRadius: 0,
                            fill: false
                        }, {
                            label: 'Próg Spadku (dół)',
                            data: Array(50).fill(3),
                            borderColor: '#F59E0B',
                            borderDash: [5, 5],
                            borderWidth: 1,
                            pointRadius: 0,
                            fill: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: { duration: 0 }, // Performance for simulation
                        scales: {
                            y: {
                                min: 0,
                                max: 40,
                                title: { display: true, text: 'Przyspieszenie (m/s²)' }
                            },
                            x: { display: false }
                        }
                    }
                });
            }
        }

        // --- SIMULATION LOGIC ---
        function simulateNormal() {
            if (!algoChartInstance) return;
            const data = Array.from({length: 50}, () => 9.8 + (Math.random() * 2 - 1));
            algoChartInstance.data.datasets[0].data = data;
            algoChartInstance.update('none'); // Update without full re-render animation
        }

        function simulateFall() {
            if (!algoChartInstance) return;
            // Pattern: Steady -> Freefall (~0-3g) -> Impact Spike (>25g) -> Rest
            let data = [];
            
            // 1. Pre-fall (Steady) - 10 frames
            for(let i=0; i<10; i++) data.push(9.8 + (Math.random() - 0.5));
            
            // 2. Freefall - 5 frames
            for(let i=0; i<5; i++) data.push(2.0 + Math.random());
            
            // 3. Impact - 3 frames
            data.push(15.0);
            data.push(32.0); // SPIKE
            data.push(18.0);
            
            // 4. Post-impact (Rest) - remaining frames
            for(let i=0; i<32; i++) data.push(9.8 + (Math.random() - 0.5));

            // Animate frame by frame effect? No, simpler to just show the waveform for analysis
            algoChartInstance.data.datasets[0].data = data;
            algoChartInstance.update();
        }

        // --- ROUTING & RENDERING ---

        function router(phaseId) {
            // Update Active State in Nav
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const navBtn = document.getElementById('nav-' + phaseId);
            if (navBtn) navBtn.classList.add('active');

            // Find Data
            const data = projectData.phases[phaseId];
            if (!data) return;

            // Render Content
            const contentArea = document.getElementById('content-area');
            
            // Fade Out
            contentArea.style.opacity = '0';
            
            setTimeout(() => {
                contentArea.innerHTML = `
                    <div class="fade-in max-w-5xl mx-auto pb-12">
                        <header class="mb-8 border-b border-brand-200 pb-6">

                            <span>System Detekcji Upadków v1.0</span>
                            <span>Generated from Source Report</span>
                        </div>
                    </div>
                `;
                
                // Re-init charts if necessary
                initCharts();

                // Fade In
                contentArea.style.opacity = '1';
                
                // Mobile menu close
                document.getElementById('mobile-menu').classList.add('hidden');
                
            }, 200);
        }

        // --- MOBILE MENU ---
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
            
            // Populate mobile nav if empty
            const list = document.getElementById('mobile-nav-list');

                const links = [

                    {id: 'phase1', txt: '1. Środowisko'},
                    {id: 'phase2', txt: '2. Architektura'},
                    {id: 'phase3', txt: '3. Usługa w Tle'},
                    {id: 'phase4', txt: '4. Algorytmy'},
                    {id: 'phase5', txt: '5. Reakcja'},
                    {id: 'phase6', txt: '6. Interfejs'},
                    {id: 'phase7', txt: '7. Wdrożenie'},
                ];
                list.innerHTML = links.map(l => `
                    <li><button onclick="router('${l.id}')" class="block w-full text-left px-4 py-3 rounded text-gray-700 hover:bg-gray-100 font-medium">${l.txt}</button></li>
                `).join('');
            }
        }

        // --- INIT ---
        window.addEventListener('DOMContentLoaded', () => {
            router('overview');
        });

    </script>
